# ADR-0013: every app command, for the `main` window only (capabilities/main.json).
# Kept equal to `src/guard/table.rs` by `guard::capability_tests`.

[[set]]
identifier = "mooring-main"
description = "All Mooring app commands. Granted to the main window only."
permissions = [
  "allow-app-info",
  "allow-vault-status",
  "allow-vault-create",
  "allow-vault-unlock",
  "allow-vault-lock",
  "allow-vault-change-password",
  "allow-tree-list",
  "allow-folder-create",
  "allow-folder-rename",
  "allow-folder-move",
  "allow-folder-set-default-credential",
  "allow-folder-delete",
  "allow-connection-create",
  "allow-connection-update",
  "allow-connection-move",
  "allow-connection-delete",
  "allow-connection-search",
  "allow-connection-set-role-credential",
  "allow-credential-kinds",
  "allow-credential-list",
  "allow-credential-create",
  "allow-credential-update-fields",
  "allow-credential-replace-secrets",
  "allow-credential-delete",
  "allow-credential-parse-account",
  "allow-credential-copy-secret",
  "allow-credential-copy-otp",
  "allow-session-open",
  "allow-session-send",
  "allow-session-close",
  "allow-session-list",
  "allow-window-detach",
  "allow-session-frame-ack",
  "allow-session-attach",
  "allow-session-screenshot",
  "allow-session-set-view-only",
  "allow-known-certs-list",
  "allow-known-certs-remove",
  "allow-connection-options-get",
  "allow-connection-options-set",
  "allow-audit-tail",
  "allow-audit-verify",
  "allow-forward-open",
  "allow-forward-close",
  "allow-forward-list",
  "allow-sftp-list",
  "allow-sftp-stat",
  "allow-sftp-mkdir",
  "allow-sftp-rename",
  "allow-sftp-remove",
  "allow-sftp-pick-local",
  "allow-sftp-download",
  "allow-sftp-upload",
  "allow-sftp-transfers",
  "allow-sftp-cancel",
  "allow-autolock-get",
  "allow-autolock-set",
  "allow-syslog-get",
  "allow-syslog-set",
  "allow-syslog-test",
  "allow-web-open",
  "allow-web-close",
  "allow-web-focus",
  "allow-web-reload",
  "allow-web-print",
  "allow-web-clear-data",
  "allow-web-zoom",
