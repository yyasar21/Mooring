# ADR-0013: every app command, for the `main` window only (capabilities/main.json).
# Kept equal to `src/guard/table.rs` by `guard::capability_tests`.

[[set]]
identifier = "mooring-main"
description = "All Mooring app commands. Granted to the main window only."
permissions = [
  "allow-app-info",
  "allow-vault-status",
  "allow-vault-create",
  "allow-vault-unlock",
  "allow-vault-lock",
  "allow-vault-change-password",
  "allow-tree-list",
  "allow-folder-create",
  "allow-folder-rename",
  "allow-folder-move",
  "allow-folder-set-default-credential",
  "allow-folder-delete",
  "allow-connection-create",
  "allow-connection-update",
  "allow-connection-move",
  "allow-connection-delete",
  "allow-connection-search",
  "allow-connection-set-role-credential",
  "allow-credential-kinds",
  "allow-credential-list",
  "allow-credential-create",
  "allow-credential-update-fields",
  "allow-credential-replace-secrets",
  "allow-credential-delete",
  "allow-credential-parse-account",
  "allow-credential-copy-secret",
  "allow-credential-copy-otp",
  "allow-session-open",
  "allow-session-send",
  "allow-session-close",
  "allow-session-list",
  "allow-window-detach",
  "allow-session-frame-ack",
  "allow-session-attach",
  "allow-session-screenshot",
  "allow-session-set-view-only",
  "allow-known-certs-list",
  "allow-known-certs-remove",
  "allow-connection-options-get",
  "allow-connection-options-set",
  "allow-audit-tail",
  "allow-audit-verify",
  "allow-forward-open",
  "allow-forward-close",
  "allow-forward-list",
  "allow-sftp-list",
  "allow-sftp-stat",
  "allow-sftp-mkdir",
  "allow-sftp-rename",
  "allow-sftp-remove",
  "allow-sftp-pick-local",
  "allow-sftp-download",
  "allow-sftp-upload",
  "allow-sftp-transfers",
  "allow-sftp-cancel",
  "allow-autolock-get",
  "allow-autolock-set",
  "allow-syslog-get",
  "allow-syslog-set",
  "allow-syslog-test",
  "allow-web-open",
  "allow-web-close",
  "allow-web-focus",
  "allow-web-reload",
  "allow-web-print",
  "allow-web-clear-data",
  "allow-web-zoom",
  "allow-web-list",
  "allow-window-attach",
  # ADR-0014 K4: Kubernetes
  "allow-kube-open",
  "allow-kube-access",
  "allow-kube-contexts",
  "allow-kube-namespaces",
  "allow-kube-pods",
  "allow-kube-pod",
  "allow-kube-exec-open",
  "allow-kube-logs-open",
  "allow-kube-logs-close",
  # ADR-0017 S2: vault sync
  "allow-sync-configure",
  "allow-sync-status",
  "allow-sync-now",
  "allow-sync-resolve-fork",
  "allow-sync-disable",
  "allow-vault-join",
  # ADR-0015 V2: vSphere
  "allow-vsphere-test",
  "allow-vsphere-sync-enable",
  "allow-vsphere-sync-disable",
  "allow-vsphere-refresh",
  "allow-vsphere-status",
  "allow-vsphere-vm-power",
  "allow-vsphere-vm-action",
  "allow-vsphere-vm-identity",
  "allow-vsphere-console",
  # ADR-0016 E2: secret sources
  "allow-secret-source-list",
  "allow-secret-source-get",
  "allow-secret-source-create",
  "allow-secret-source-update",
  "allow-secret-source-delete",
  "allow-secret-source-test",
  "allow-secret-source-revoke",
  "allow-credential-external-test",
  "allow-secret-source-oidc-begin",
  "allow-secret-source-oidc-status",
  # ADR-0018 U0: in-app updates
  "allow-update-check",
  "allow-update-install",
  "allow-update-settings-get",
  "allow-update-settings-set",
  # ADR-0020 (A4 N1): network tools
  "allow-net-tools",
  "allow-net-port-check",
  "allow-net-ping",
  "allow-net-traceroute",
  "allow-net-wg-show",
  # ADR-0019 (A4 I1): importers
  "allow-import-formats",
  "allow-import-pick",
  "allow-import-preview",
  "allow-import-apply",
  "allow-import-discard",
  # ADR-0019 §4 (A4 I2): LDAPS directory importer
  "allow-ldap-import-preview",
  "allow-ldap-import-test",
]
