[package]
name = "mooring-app"
description = "Mooring desktop application (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "mooring_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exposes the command layer, `state::testing` fixtures and the in-process SSH test server to
# integration tests (src-tauri/tests/e2e_flow). Never enabled in a release build.
test-util = ["dep:tempfile", "dep:russh", "dep:russh-sftp"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"  # ADR-0010: OS file pickers for SFTP transfers (capability dialog:allow-open/save only)
mooring-core = { path = "../crates/mooring-core", version = "0.1.0-rc.1" }
mooring-vault = { path = "../crates/mooring-vault", version = "0.1.0-rc.1" }
mooring-audit = { path = "../crates/mooring-audit", version = "0.1.0-rc.1" }
mooring-store = { path = "../crates/mooring-store", version = "0.1.0-rc.1" }
mooring-proto-ssh = { path = "../crates/mooring-proto-ssh", version = "0.1.0-rc.1" }
uuid = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
arboard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }
tempfile = { workspace = true, optional = true } # test-util: fixture data dirs
russh = { workspace = true, optional = true }    # test-util: in-process SSH server
russh-sftp = { workspace = true, optional = true } # test-util: SFTP subsystem of the test server (already a workspace dep)

[dev-dependencies]
# Turns on `test-util` for this package's own tests, so `cargo test --workspace` builds
# e2e_flow against `mooring_app_lib::...` without extra flags.
mooring-app = { path = ".", features = ["test-util"] }
tempfile = { workspace = true }
russh = { workspace = true }   # in-process SSH server for session_open tests (already a workspace dep)
russh-sftp = { workspace = true } # SFTP subsystem of the in-process test server (already a workspace dep)

[lints]
workspace = true
