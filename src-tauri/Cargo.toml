[package]
name = "mooring-app"
description = "Mooring desktop application (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "mooring_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exposes the command layer, `state::testing` fixtures and the in-process SSH test server to
# integration tests (src-tauri/tests/e2e_flow). Never enabled in a release build.
test-util = ["dep:tempfile", "dep:russh", "dep:russh-sftp"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { workspace = true } # ADR-0028 §1: build.rs re-derives the effective identifier (already in the tree)

[dependencies]
tauri = { version = "=2.12.5", features = [] }  # ADR-0013 / review 5 L-32: pinned to the reviewed release; bumps go through Dependabot + review
tauri-plugin-dialog = "2"  # ADR-0010 / review 4 B-4: native pickers opened from Rust only; the WebView gets no dialog:* permission
# ADR-0018 §3 (A4 U0): in-app updates, Rust-side only (no `updater:*` permission in any capability);
# registered only when `plugins.updater.pubkey` is set. `zip` (v1 bundles) dropped on purpose.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
# L-40: bounded updater manifest fetch (same reqwest / rustls the updater plugin already builds; no new crate).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { workspace = true } # L-40: bounded updater manifest fetch (ring provider for the reqwest client above)
semver = "1" # ADR-0018 §3: strict version comparison of the update manifest (already in the tree via tauri)
mooring-core = { path = "../crates/mooring-core", version = "0.2.0-rc.3" }
mooring-vault = { path = "../crates/mooring-vault", version = "0.2.0-rc.3" }
mooring-audit = { path = "../crates/mooring-audit", version = "0.2.0-rc.3" }
mooring-store = { path = "../crates/mooring-store", version = "0.2.0-rc.3" }
mooring-proto-ssh = { path = "../crates/mooring-proto-ssh", version = "0.2.0-rc.3" }
mooring-proto-rdp = { path = "../crates/mooring-proto-rdp", version = "0.2.0-rc.3" } # ADR-0011: RDP sessions (IronRDP); R-RDP-FFI tree accepted by the owner
mooring-proto-vnc = { path = "../crates/mooring-proto-vnc", version = "0.2.0-rc.3" } # ADR-0012: VNC sessions (own RFB 3.8 client)
mooring-proto-kube = { path = "../crates/mooring-proto-kube", version = "0.2.0-rc.3" } # ADR-0014 K4: read-only Kubernetes sessions (K3 crate, reviewed with K3)
mooring-http = { path = "../crates/mooring-http", version = "0.2.0-rc.3" } # ADR-0014 K4: HttpConfig template for the kube client; ADR-0017 S2: trust-prompt errors of the sync Gate; ADR-0015 V2: HttpConfig / trust prompt of the vCenter client (K1 crate)
mooring-sync = { path = "../crates/mooring-sync", version = "0.2.0-rc.3" } # ADR-0017 S2: vault sync commands (internal crate)
mooring-vsphere = { path = "../crates/mooring-vsphere", version = "0.2.0-rc.3" } # ADR-0015 V2: inventory sync, power, consoles (workspace crate, no new third-party code)
mooring-secrets = { path = "../crates/mooring-secrets", version = "0.2.0-rc.3" } # ADR-0016 E2: Vault / OpenBao resolver (E1 crate, no third-party dependency)
mooring-net = { path = "../crates/mooring-net", version = "0.2.0-rc.3" } # ADR-0020 N1: TCP check, ping / traceroute / wg show runners (workspace crate, no new third-party code)
mooring-import = { path = "../crates/mooring-import", version = "0.2.0-rc.3", features = ["directory"] } # ADR-0019 I1: file importers (workspace crate; quick-xml/flate2 already in the tree); I2: LDAPS directory importer (lber + tokio-rustls, in the tree)
uuid = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
hkdf = "0.13"                      # ADR-0022: derive the vault wrapping key from the biometric-gated secret (RustCrypto)
rand_core = { workspace = true } # review 4 B-4: random 128-bit pickId (already used by mooring-vault / proto-ssh)
hex = { workspace = true }       # review 4 B-4: pickId encoding (already used by mooring-audit)
base64 = { workspace = true }
arboard = { workspace = true, features = ["image-data"] } # A2 session_screenshot: RGBA to the OS clipboard; adds the `image` crate (MIT OR Apache-2.0; png on Linux, tiff on macOS, png+bmp on Windows)
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }
sysinfo = { workspace = true }                   # ADR-0010: local host name for the syslog HOSTNAME field (already in the tree via mooring-vault)
tempfile = { workspace = true, optional = true } # test-util: fixture data dirs
russh = { workspace = true, optional = true }    # test-util: in-process SSH server
russh-sftp = { workspace = true, optional = true } # test-util: SFTP subsystem of the test server (already a workspace dep)

[dev-dependencies]
# Turns on `test-util` for this package's own tests, so `cargo test --workspace` builds
# e2e_flow against `mooring_app_lib::...` without extra flags.
mooring-app = { path = ".", features = ["test-util"] }
tempfile = { workspace = true }
russh = { workspace = true }   # in-process SSH server for session_open tests (already a workspace dep)
russh-sftp = { workspace = true } # SFTP subsystem of the in-process test server (already a workspace dep)
mooring-testsrv = { path = "../crates/mooring-testsrv" } # A2 e2e_flow: loopback RFB/RDP servers (QA, dev-only)

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] } # ADR-0022 (OSX_10_15: data-protection keychain): Keychain item with BiometryCurrentSet ACL (safe API; FFI inside the crate)

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials", "Foundation", "Storage_Streams"] } # ADR-0022: KeyCredentialManager (Windows Hello), safe WinRT projections only

[lints]
workspace = true
