[package]
name = "mooring-app"
description = "Mooring desktop application (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "mooring_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
mooring-core = { path = "../crates/mooring-core", version = "0.1.0" }
mooring-vault = { path = "../crates/mooring-vault", version = "0.1.0" }
mooring-audit = { path = "../crates/mooring-audit", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
