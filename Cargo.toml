[workspace]
resolver = "2"
members = [
  "crates/mooring-core",
  "crates/mooring-vault",
  "crates/mooring-store",
  "crates/mooring-audit",
  "crates/mooring-proto-ssh",
  "crates/mooring-proto-rdp",
  "crates/mooring-proto-vnc",
  "crates/mooring-http",
  "crates/mooring-vsphere",
  "crates/mooring-proto-kube",
  "crates/mooring-sync",
  "crates/mooring-secrets", # A3 E1: Vault / OpenBao KV v2 client on mooring-http (ADR-0016)
  "crates/mooring-net",     # A4 N1: TCP port check, OS ping / traceroute / wg show runners + hostile parsers (ADR-0020)
  "crates/mooring-import",  # A4 I1: file importers into a dry-run plan (ADR-0019)
  "crates/mooring-testsrv", # dev-only loopback RFB/RDP test servers (A2 Q2); never a product dependency
  "src-tauri",
]
# src-tauri needs the OS WebView toolchain; `cargo test --workspace --exclude mooring-app`
# covers the pure crates on any machine.
default-members = [
  "crates/mooring-core",
  "crates/mooring-vault",
  "crates/mooring-store",
  "crates/mooring-audit",
  "crates/mooring-proto-ssh",
  "crates/mooring-proto-rdp",
  "crates/mooring-proto-vnc",
  "crates/mooring-http",
  "crates/mooring-vsphere",
  "crates/mooring-proto-kube",
  "crates/mooring-sync",
  "crates/mooring-secrets",
  "crates/mooring-net",
  "crates/mooring-import",
]

[workspace.package]
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.95"  # sysinfo 0.40 floor; rusqlite 0.41 needs ≥ 1.89
license = "MIT"
authors = ["Yunus Yaşar"]
repository = "https://github.com/yyasar21/Mooring"

[workspace.dependencies]
# crypto (RustCrypto only — see ADR-0002)
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha2 = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
age = { version = "0.12", features = ["armor"] }          # ADR-0006: age-compatible export (RustCrypto, pure Rust)
sysinfo = { version = "0.40", default-features = false, features = ["system"] } # ADR-0006: RAM cap for Argon2 calibration
# ssh (ADR-0007): ring backend only, aws-lc-rs off
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] } # no flate2: compression is none only (review 5 N-35)
russh-sftp = "3"
# data
rusqlite = { version = "0.41", features = ["bundled"] } # ADR-0005: single SQLite store, bundled for 3-OS parity
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
hex = { version = "0.4", features = ["serde"] }
base64 = "0.23"                                          # ADR-0008: base64 byte payloads on the IPC wire (already in the tree via tauri/russh)
arboard = { version = "3.7", default-features = false }   # A1: Rust-side clipboard for credential_copy_password (pure Rust, MIT/Apache-2.0, text only, no plugin/capability)
# credentials (ADR-0009)
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["alloc", "ecdsa"] } # OpenSSH public key / certificate fingerprints; same pinned version russh already pulls in
pem-rfc7468 = { version = "1", features = ["alloc"] }    # strict RFC 7468 PEM decoding for X.509 fingerprints (RustCrypto, already in the tree via der)
data-encoding = "2.11"                                     # RFC 4648 base32 for TOTP seeds (already in the tree via russh; replaces a separate base32 crate)
saphyr-parser = "0.3"                                      # pure-Rust event-level YAML 1.2 parser for capped kubeconfig validation (no unsafe-libyaml, no serde magic)
hmac = "0.13"                                              # RFC 6238 TOTP (RustCrypto, already in the tree via russh/proto-ssh)
sha1 = "0.11"                                              # RFC 6238 TOTP HMAC-SHA1 (the RFC default; already in the tree)
sha2-next = { package = "sha2", version = "0.11" }         # TOTP HMAC-SHA256/512 + cert fingerprints on digest 0.11 (matches hmac 0.13; already in the tree via ssh-key)
# audit syslog mirror (ADR-0010 item 5): TLS transport, pure Rust, ring provider only
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] } # RFC 5425 syslog over TLS; rustls is the only allowed TLS stack (ADR-0001)
rustls-native-certs = "0.8"                                # OS trust store for syslog TLS (enterprise CAs honoured); no C build, platform APIs only
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] } # tests only: self-signed cert for the loopback TLS collector
# LDAPS directory importer (ADR-0019 §4, A4 I2). `lber` (MIT, no unsafe) is ldap3's BER codec:
# the product encodes its four requests with it and parses frames that passed an iterative
# size / depth scan. `ldap3` itself is a dev-dependency only (independent RFC 4515 parser as the
# escaping oracle): its transport recurses per BER nesting level and `expect`s on malformed
# frames, so it never sees server bytes in the product. rustls + ring only (the `tls-rustls`
# feature alone does not compile: a provider feature is mandatory); no sync / GSSAPI / NTLM.
ldap3 = { version = "=0.12.1", default-features = false, features = ["tls-rustls-ring"] }
lber = "=0.5.1"
# errors / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "process"] } # `process`: ADR-0020 OS ping / traceroute / wg runners (mooring-net); signal-hook-registry was already in the lockfile
async-trait = "0.1"
# tests
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unknown_lints = "allow" # lint names below span clippy 1.95–1.99; older toolchains must not warn on the newer ones
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic allow-list, each with a reason (ADR-0001 §tooling)
module_name_repetitions = "allow" # VaultError inside vault:: is fine
must_use_candidate = "allow"      # too noisy on builders
missing_errors_doc = "allow"      # error enums are documented at the type
missing_panics_doc = "allow"
unwrap_used = "deny"              # never in library code; tests use expect()
expect_used = "allow"           # tests; library code still avoids it by review
dbg_macro = "deny"
print_stdout = "deny"             # logging goes through tracing with redaction
print_stderr = "deny"
todo = "deny"
duration_suboptimal_units = "allow" # from_mins/from_hours would raise the MSRV; `15 * 60` reads fine
unused_async = "allow"              # async trait impls must keep the signature even without .await
unused_async_trait_impl = "allow"   # same, the 1.99 name for trait impls (russh Handler, Session)
assert_is_empty = "allow"           # style only; assert!(x.is_empty()) reads fine in tests

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind" # ADR-0011: a protocol/decoder panic ends one session task, not the process

# The export path runs real scrypt (log N = 18, ADR-0006); keep debug test runs fast.
[profile.dev.package.scrypt]
opt-level = 3

# age 0.12.1 on crates.io pins ml-kem 0.2; russh 0.65 needs ml-kem 0.3 (kem 0.3). age's main
# already migrated (str4d/rage f7c95f4), pinned to a commit of the official repository with the
# owner's approval (2026-11-03). Drop this when age 0.13 is published.
[patch.crates-io]
age = { git = "https://github.com/str4d/rage", rev = "b5b68c4" }
