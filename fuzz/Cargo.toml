# cargo-fuzz workspace (nightly + libFuzzer). Deliberately its own workspace: the main
# `cargo test --workspace` never builds libfuzzer-sys. The entry logic lives in `entries/` and is
# replayed on stable by `crates/*/tests/fuzz_corpus.rs`. See docs/qa/fuzzing.md.
[package]
name = "mooring-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13" # libFuzzer driver for cargo-fuzz; fuzz crate only, never in the app
mooring-core = { path = "../crates/mooring-core" }
mooring-vault = { path = "../crates/mooring-vault" }
mooring-proto-ssh = { path = "../crates/mooring-proto-ssh" }
mooring-proto-rdp = { path = "../crates/mooring-proto-rdp" } # A2: active stage, cliprdr, certificate, input entries
mooring-proto-vnc = { path = "../crates/mooring-proto-vnc" } # A2: RFB server messages, ZRLE, Tight entries
# A3 (ADR-0014..0017): kube frames / logs / guard, vCenter bodies, Vault bodies + OIDC URLs,
# MSY1 blob + snapshot JSON, mooring-http header / body / certificate parsers.
mooring-http = { path = "../crates/mooring-http" }
mooring-proto-kube = { path = "../crates/mooring-proto-kube" }
mooring-vsphere = { path = "../crates/mooring-vsphere" }
mooring-secrets = { path = "../crates/mooring-secrets" }
mooring-sync = { path = "../crates/mooring-sync" }
# A4 (ADR-0020 N1): ping / traceroute / wg show output parsers.
mooring-net = { path = "../crates/mooring-net" }
# A4 (ADR-0019, I1): the six file importers plus `detect`; I2: the directory importer's
# escaping and BER response entries (feature `directory`).
mooring-import = { path = "../crates/mooring-import", features = ["directory"] }
# Same versions / features as the root workspace (entries name them directly).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
secrecy = { version = "0.10", features = ["serde"] }
# kubeconfig oracle re-scans accepted input with mooring-core's own YAML event parser (M-11);
# same version as the root lockfile, no new crate in the tree.
saphyr-parser = "=0.3.3"

# Remaining A3 gate (docs/qa/fuzzing.md, "A3 targets"): the product parses no S3 XML, so the
# target stays a compiling no-op flagged by the nightly "Stub notice" step until an ADR drops it.
[features]
s1 = [] # s3_error_xml: rusty-s3 presign + raw PUT/GET/HEAD/DELETE only

# Mirrors the root workspace's patch (Cargo.toml): age 0.12.1 on crates.io pins ml-kem 0.2,
# which no longer builds next to russh's ml-kem 0.3 / kem 0.3 (`cargo check --bins` failed on
# `ml-kem 0.2.1` before this, A4 Q1). Same commit, same reason; drop both when age 0.13 ships.
[patch.crates-io]
age = { git = "https://github.com/str4d/rage", rev = "b5b68c4" }

