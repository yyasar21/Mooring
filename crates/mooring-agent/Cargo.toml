[package]
name = "mooring-agent"
description = "Mooring relay agent: loopback proxy, E2E tunnel, local session runner (ADR-0029)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
mooring-core = { path = "../mooring-core", version = "0.2.0-rc.3" }
mooring-relay = { path = "../mooring-relay", version = "0.2.0-rc.3", optional = true }
base64 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "alloc", "pkcs8", "rand_core"], optional = true }
hkdf = { version = "0.13", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
rand_core = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
mooring-core = { path = "../mooring-core", version = "0.2.0-rc.3" }
mooring-relay = { path = "../mooring-relay", version = "0.2.0-rc.3" }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
tracing-subscriber = { workspace = true }

[features]
default = ["agent"]
agent = [
  "dep:base64",
  "dep:chacha20poly1305",
  "dep:ed25519-dalek",
  "dep:futures-util",
  "dep:hkdf",
  "dep:mooring-relay",
  "dep:rand_core",
  "dep:ring",
  "dep:serde",
  "dep:serde_json",
  "dep:sha2",
  "dep:thiserror",
  "dep:tokio",
  "dep:tokio-tungstenite",
  "dep:tracing",
  "dep:uuid",
  "dep:x25519-dalek",
  "dep:zeroize",
]
