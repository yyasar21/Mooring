[package]
name = "mooring-vault"
description = "Encrypted credential vault: Argon2id KDF, XChaCha20-Poly1305 records, zeroized keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { workspace = true, features = ["zeroize"] } # review L3: wipe Argon2 initial and final block hashes
chacha20poly1305 = { workspace = true }
hkdf = "0.13"              # ADR-0017 §2: sync key = HKDF-SHA256(DEK, vault_id, info) (RustCrypto, already in the tree)
sha2 = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sysinfo = { workspace = true }
uuid = { workspace = true }
age = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
