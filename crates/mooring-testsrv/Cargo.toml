[package]
name = "mooring-testsrv"
description = "Dev-only loopback RFB 3.8 and RDP test servers for Mooring integration tests (A2 Q2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
# Certificate pin (SHA-256 of the leaf DER) for manual TOFU tests; RustCrypto, already in the tree.
sha2 = { workspace = true }
# Random VNC challenge; same version/features as the workspace.
rand_core = { workspace = true }
# rustls server side on tokio; ring only (no aws-lc-rs), same provider as the app.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# RFB VNC authentication (DES of the challenge); RustCrypto, already in the lockfile via russh.
des = "0.9"
# ZRLE / Tight zlib streams; miniz_oxide Rust backend (default), already in the tree.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# RDP acceptor side (ADR-0011 §Library versions).
ironrdp-acceptor = "0.12"
ironrdp-connector = "0.12"
ironrdp-async = "0.12"
ironrdp-tokio = { version = "0.12", default-features = false }
ironrdp-pdu = "0.11"
ironrdp-core = { version = "0.3", features = ["alloc"] }
ironrdp-svc = "0.10"
ironrdp-cliprdr = "0.9"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
# RDP 6.0 planar encoder for compressed bitmap updates (same version ironrdp-session decodes with).
ironrdp-graphics = "0.11"

[dev-dependencies]
# Verification client for the RDP self-test only (decodes the bitmap updates we send).
ironrdp-session = "0.13"
