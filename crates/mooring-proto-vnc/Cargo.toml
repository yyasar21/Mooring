[package]
name = "mooring-proto-vnc"
description = "Mooring VNC session: own RFB 3.8 client with VeNCrypt X509 and certificate TOFU (ADR-0012)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
mooring-core = { path = "../mooring-core", version = "0.1.2" }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
time = { workspace = true }
# VeNCrypt X509 transport (ADR-0011/0012): rustls with the ring provider only, system roots.
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
# Async TLS over the tokio TCP stream (rustls project, MIT/Apache-2.0/ISC, no unsafe, ring only).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# VNC Authentication DES challenge (RustCrypto, MIT OR Apache-2.0, already in the lockfile via russh).
des = { version = "0.9", features = ["zeroize"] }
# ZRLE / Tight zlib inflate, used directly so flate2's build-wide C-zlib selection can never
# reach hostile RFB bytes (review 5 M-15). Pure Rust, forbid(unsafe), MIT OR Apache-2.0 OR Zlib,
# the same version flate2 already pulls in.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
# Leaf certificate fields for the TOFU prompt (MIT OR Apache-2.0, forbid(unsafe), already in the lockfile via rcgen).
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
# Test-only compressor for ZRLE/Tight vectors (never decodes in the product).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
proptest = { workspace = true }
tempfile = { workspace = true }
rcgen = { workspace = true }
# QA's loopback RFB 3.8 server (A2 Q2): dev-only, never a product dependency.
mooring-testsrv = { path = "../mooring-testsrv" }
