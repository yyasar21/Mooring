[graph]
all-features = false
targets = ["x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # proc-macro-error is pulled in transitively by the Tauri toolchain (compile-time only); tracked for A4
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri build deps, proc-macro only" },
  # rsa Marvin timing side channel: no fixed release exists; Mooring only *signs* client-side
  # (publickey auth), never decrypts, so there is no oracle. Accepted risk R-RSA (a1-review-2).
  { id = "RUSTSEC-2023-0071", reason = "rsa used for SSH client signing only; no decryption oracle (R-RSA)" },
  # basic-toml: compile-time only, via age -> i18n-embed-fl proc-macro; goes away with age 0.13.
  { id = "RUSTSEC-2026-0374", reason = "build-time proc-macro dependency of age (i18n-embed-fl); not in the binary" },
  # zbus / zvariant: Secret Service transport of the `keyring` crate on Linux (keyring commands are on HOLD, see ADR-0006);
  # revisit when keyring moves to a maintained zbus release.
  { id = "RUSTSEC-2026-0370", reason = "zvariant via keyring secret-service backend; keyring unlock not wired yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via keyring secret-service backend; keyring unlock not wired yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via keyring secret-service backend; keyring unlock not wired yet" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OpenSSL", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # path deps inside the workspace
deny = [
  { crate = "openssl", reason = "rustls only (ADR-0001)" },
  { crate = "openssl-sys", reason = "rustls only (ADR-0001)" },
  { crate = "native-tls", reason = "rustls only (ADR-0001)" },
  # russh needs md5 only to render legacy MD5 host-key fingerprints; Mooring never hashes with it.
  { crate = "md5", reason = "weak hash", wrappers = ["russh"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# One approved git source: age pinned to str4d/rage until age 0.13 ships (see root Cargo.toml [patch]).
allow-git = ["https://github.com/str4d/rage"]
