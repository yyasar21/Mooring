<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credential detail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="harbor.css">
</head>
<body data-view="credentials">
<template id="center">
  <div style="display:grid;grid-template-columns:minmax(0,1fr) 440px;height:100%;min-height:0">
    <section style="display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)">
      <div class="page-head"><h1 class="t-page">Credentials</h1><span class="badge">12</span><span class="grow"></span><button class="btn">Import…</button><button class="btn primary"><i data-i="plus" data-s="14"></i>New credential</button></div>
      <div class="toolbar">
        <div class="input ph" style="width:300px;height:28px"><i data-i="search" data-s="14"></i>Filter by name, account or fingerprint</div>
        <div class="segmented"><span aria-pressed="true">All</span><span>Passwords</span><span>Keys</span><span>Domain</span><span>External</span></div>
        <span class="grow"></span><span class="t-caption">Sorted by name</span>
      </div>
      <div style="overflow:hidden;flex:1">
        <table class="table">
          <colgroup><col style="width:34%"><col style="width:22%"><col style="width:24%"><col style="width:10%"><col style="width:10%"></colgroup>
          <thead><tr><th class="sorted">Name <span class="sort">▲</span></th><th>Type</th><th>Account</th><th class="num">Used by</th><th>Updated</th></tr></thead>
          <tbody>
            <tr><td><span class="row"><i data-i="user" data-s="14"></i>ask at connect</span></td><td class="muted">Ask every time</td><td class="mono">ops</td><td class="num">1</td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="ext" data-s="14"></i>db via vault</span></td><td class="muted">HashiCorp Vault ref</td><td class="mono">kv/ops/db</td><td class="num">0</td><td class="muted">Nov 1</td></tr>
            <tr aria-selected="true"><td><span class="row"><i data-i="key" data-s="14"></i><b style="font-weight:500">deploy bot</b></span></td><td>Username + password</td><td class="mono">deploy</td><td class="num">2</td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="user" data-s="14"></i>domain admin</span></td><td class="muted">Domain account</td><td class="mono">EXAMPLE\admin</td><td class="num">2</td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="key" data-s="14"></i>kiosk vnc</span></td><td class="muted">VNC password</td><td class="faint">—</td><td class="num">1</td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="key" data-s="14"></i>legacy admin</span></td><td class="muted">Username + password</td><td class="mono">EXAMPLE\legacy</td><td class="num"><span class="pill warning nodot">Unused</span></td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="key" data-s="14"></i>ops on-call</span></td><td class="muted">SSH key · ED25519</td><td class="mono">ops</td><td class="num">1</td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="kubernetes" data-s="14"></i>stage kubeconfig</span></td><td class="muted">Kubeconfig</td><td class="mono">stage-admin</td><td class="num">1</td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="shield" data-s="14"></i>sudo as root</span></td><td class="muted">Privilege elevation</td><td class="mono">sudo → root</td><td class="num">1</td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="key" data-s="14"></i>team bucket key</span></td><td class="muted">S3 access key</td><td class="faint">—</td><td class="num"><span class="pill warning nodot">Unused</span></td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="ext" data-s="14"></i>vault approle</span></td><td class="muted">Vault AppRole</td><td class="faint">—</td><td class="num">0</td><td class="muted">Nov 1</td></tr>
            <tr><td><span class="row"><i data-i="user" data-s="14"></i>vcenter sso</span></td><td class="muted">vCenter SSO</td><td class="mono">administrator@vsphere.local</td><td class="num">1</td><td class="muted">Nov 1</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <section style="display:flex;flex-direction:column;min-width:0;background:var(--surface)">
      <div class="insp-head" style="padding:20px 24px 12px">
        <div class="insp-title"><span class="cred-ico"><i data-i="key"></i></span><div class="grow"><h2>deploy bot</h2><div class="t-caption">Username and password with TOTP</div></div><button class="icon-btn" aria-label="More actions"><i data-i="more"></i></button></div>
        <div class="row"><button class="btn sm">Edit</button><button class="btn sm"><i data-i="copy" data-s="14"></i>Copy password</button><button class="btn sm">Copy TOTP code</button></div>
      </div>
      <nav class="insp-tabs" style="padding:0 24px"><a href="#" aria-current="true">Overview</a><a href="#">Used by (2)</a><a href="#">Audit</a></nav>
      <div class="insp-body">
        <section class="section" style="padding:16px 24px"><h3>Account</h3>
          <dl class="kv" style="grid-template-columns:120px 1fr"><dt>Username</dt><dd class="mono">deploy</dd><dt>Domain</dt><dd class="faint">Not set</dd><dt>Updated</dt><dd>1 Nov 2026, 08:00 UTC</dd></dl>
        </section>
        <section class="section" style="padding:16px 24px"><h3>Stored secrets</h3>
          <div class="card" style="overflow:hidden">
            <div class="row" style="padding:10px 12px;border-bottom:1px solid var(--border)"><i data-i="lock" data-s="14"></i><span class="grow">Password</span><span class="pill success">Sealed</span><button class="btn sm subtle">Replace</button></div>
            <div class="row" style="padding:10px 12px"><i data-i="lock" data-s="14"></i><span class="grow">TOTP seed <span class="faint">· 6 digits, 30 s, SHA1</span></span><span class="pill success">Sealed</span><button class="btn sm subtle">Replace</button></div>
          </div>
          <div class="callout warning" style="margin-top:12px"><span class="ci"><i data-i="alert" data-s="14"></i></span><span style="font-size:12px;line-height:18px">The TOTP seed sits next to the password, so anyone who opens this vault has both factors. Prefer an authenticator on another device.</span></div>
        </section>
        <section class="section" style="padding:16px 24px"><h3>Works with</h3>
          <div class="row" style="flex-wrap:wrap;gap:6px"><span class="badge"><i data-i="ssh" data-s="12"></i>SSH</span><span class="badge"><i data-i="rdp" data-s="12"></i>RDP</span><span class="badge"><i data-i="web" data-s="12"></i>Web</span><span class="badge"><i data-i="vsphere" data-s="12"></i>vSphere console</span></div>
        </section>
        <section class="section" style="padding:16px 24px;border-bottom:0"><h3>Used by</h3>
          <div class="row" style="padding:4px 0"><i data-i="ssh" data-s="14"></i><span class="grow">pg-primary</span><span class="faint">Production / Databases</span></div>
          <div class="row" style="padding:4px 0"><i data-i="ssh" data-s="14"></i><span class="grow">stage-app</span><span class="faint">Staging</span></div>
        </section>
      </div>
    </section>
  </div>
</template>
<template id="overlay">
  <div class="toast" role="status"><span class="ti"><i data-i="check"></i></span><div class="grow"><b style="font-weight:500">Credential saved</b><div class="t-caption">deploy bot · recorded in the audit log</div></div><button class="icon-btn sm" aria-label="Dismiss"><i data-i="x" data-s="12"></i></button></div>
</template>
</body>
<script src="shell.js"></script>
</html>
