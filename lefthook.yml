pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --exclude nexus-app --all-targets -- -D warnings
    eslint:
      glob: "apps/**/*.{ts,tsx}"
      run: pnpm --filter @nexus/desktop lint
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact
commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -Eq '^(feat|fix|docs|refactor|test|chore|perf|build|ci|security)(\([a-z0-9-]+\))?!?: .{1,72}$' \
          || { echo "commit message must follow Conventional Commits"; exit 1; }
