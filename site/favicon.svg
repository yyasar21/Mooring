<?xml version="1.0" encoding="UTF-8"?>
<!-- Mooring app icon, Harbor proposal (1024x1024 master). Original artwork for this project
     (MIT, see LICENSE). Same bollard-and-line silhouette as packaging/icon-mono.svg and the
     in-app BrandMark, drawn flat in the Harbor accent (#1a5fb4) on a quiet light plate with a
     hairline edge. No gradients, glows, filters, raster or fonts.
     Proposal only: src-tauri/icons is unchanged until the owner decides (docs/handoff/a5-docs-refresh.md). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Mooring</title>
  <defs>
    <!-- knocks a clear band out of the post where the front half of the loop crosses it -->
    <mask id="gap">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M322 584 A190 66 0 0 0 702 584" fill="none" stroke="#000" stroke-width="104" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- plate: Harbor surface with a hairline border -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#ffffff"/>
  <rect x="34" y="34" width="956" height="956" rx="222" fill="none" stroke="#c9ced4" stroke-width="4"/>

  <!-- the line from the quay and the back half of the loop -->
  <g fill="none" stroke="#1a5fb4" stroke-linecap="round" stroke-width="64">
    <path d="M330 590 C 262 624, 210 714, 168 812"/>
    <path d="M322 584 A190 66 0 0 1 702 584"/>
  </g>
  <!-- the bollard: cap and post, with the gap for the loop -->
  <g fill="#1a5fb4" mask="url(#gap)">
    <path d="M296 380 v-52 a216 112 0 0 1 432 0 v52 a24 24 0 0 1 -24 24 h-384 a24 24 0 0 1 -24 -24 z"/>
    <path d="M432 394 h160 l8 300 c2 30 18 40 44 44 h8 a22 22 0 0 1 22 22 v22 a22 22 0 0 1 -22 22 h-280 a22 22 0 0 1 -22 -22 v-22 a22 22 0 0 1 22 -22 h8 c26 -4 42 -14 44 -44 z"/>
  </g>
  <!-- front half of the loop -->
  <path d="M322 584 A190 66 0 0 0 702 584" fill="none" stroke="#1a5fb4" stroke-width="64" stroke-linecap="round"/>
</svg>
