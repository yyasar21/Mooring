# Nightly cargo-fuzz run of every target in fuzz/ for a bounded time (ADR-0010 §Consequences).
# A crash fails the job and uploads the reproducer; nothing is opened or pushed automatically.
# Triage: docs/qa/fuzzing.md. The same entry points replay fuzz/corpus + fuzz/regressions on
# stable in every `cargo test --workspace` (crates/*/tests/fuzz_corpus.rs).
# Actions are pinned by commit SHA with the tag in a comment (security review 3, L-14), the same
# pins as ci.yml.
name: fuzz-nightly
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily, off the top of the hour
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "120"
concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  CARGO_TERM_COLOR: never

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - known_hosts_parse
          - kubeconfig_parse
          - vault_header_from_bytes
          - import_age
          - socks5_handshake
          # A2 (Q2 scaffolding): compiling no-op stubs until their parser lands behind the
          # fuzz crate's r1 / r3 / r4 feature; the "Stub notice" step flags them in the run.
          - mfr1_decode
          - known_certs_parse
          - rfb_server_msg
          - rdp_fastpath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11
        with: { toolchain: nightly }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - name: Install cargo-fuzz ${{ env.CARGO_FUZZ_VERSION }}
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Stub notice
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if grep -q 'PENDING' "fuzz/fuzz_targets/$TARGET.rs"; then
            echo "::warning::$TARGET is a no-op stub until its feature gate is enabled (docs/qa/fuzzing.md)"
          fi
      - name: Build
        run: cargo +nightly fuzz build "${{ matrix.target }}"
      # Seeds + past crashes are the starting corpus; new corpus entries stay on the runner.
      # import_age may run scrypt up to N = 2^20 (~1 GiB) per input, hence the RSS limit.
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '120' }}
        run: |
          case "$SECONDS_PER_TARGET" in ''|*[!0-9]*) echo "::error::seconds must be a number"; exit 2;; esac
          cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/regressions/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=60 -rss_limit_mb=3072 -print_final_stats=1
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
