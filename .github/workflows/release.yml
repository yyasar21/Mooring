# Release pipeline (docs/release.md, ADR-0018). A `vX.Y.Z` tag builds every installer into a
# DRAFT GitHub Release; a maintainer reviews and publishes it by hand. Pre-release tags
# (`v0.1.0-rc.2`) build a draft pre-release: Linux ships the .deb only (the rpm and AppImage
# bundlers reject `-` in a version), the MSI carries the numeric version, and GitHub never
# serves a pre-release as `releases/latest`, so the updater channel does not see it.
#
#   macOS   .dmg + .app (+ .pkg via pkgbuild/productbuild): aarch64, x86_64, universal
#   Windows .exe (NSIS, per-user) + .msi (WiX): x64
#   Linux   .deb + .rpm + .AppImage: x86_64 (ubuntu-22.04), aarch64 (ubuntu-22.04-arm)
#   Portable (ADR-0021) Mooring_<v>_x64_portable.zip (bare exe) and _universal_portable.zip
#           (the .app) + `portable` marker + README.txt, built by scripts/release/portable-zip.py
#           (deterministic); regular assets, never updater artifacts, never in latest.json.
#   All     SHA256SUMS + Sigstore bundle (cosign keyless), CycloneDX SBOMs, SLSA provenance.
#           Tauri updater artifacts (`.sig` + latest.json) only when the `release` environment
#           holds TAURI_SIGNING_PRIVATE_KEY; `sign-updater` signs, `finalize` writes the manifest
#           (scripts/release/updater-manifest.sh), so no tauri-action job races for it.
#
# Signing is opt-in per secret: a fork without secrets still produces unsigned installers.
# Secrets are exported only when non-empty, because the Tauri bundler treats a set-but-empty
# APPLE_CERTIFICATE as "sign with this" and fails. Nothing here echoes a secret.
# No build cache on purpose: release builds must not consume caches written by PR runs.
# The Rust toolchain is pinned (RUST_TOOLCHAIN) to the version release-repro.yml checks (N-57).
#
# Jobs are split by privilege (security review 3, M-7; review 7, M-17). Third-party code (npm
# and cargo build scripts, tauri-action, cargo-cyclonedx, syft) only ever runs with
# `contents: read` and never next to the updater key:
#   create-release  contents: write   creates the draft; runs no project or third-party code;
#                                     lints this file (the updater key may only be referenced
#                                     by sign-updater) and hands scripts/release/*.sh to
#                                     finalize as an artifact
#   build           contents: read    builds and uploads workflow artifacts only. It never sees
#                                     TAURI_SIGNING_PRIVATE_KEY: `createUpdaterArtifacts` is
#                                     forced off, and the macOS updater archive is a plain
#                                     `tar -czf` of the signed .app (the NSIS -setup.exe and the
#                                     AppImage are their own updater artifacts in the v2 format)
#   sbom            contents: read    cargo-cyclonedx + syft, pinned; no id-token
#   sign-updater    contents: read    environment `release` (owner approves; deployment policy
#                                     tags `v*`). No checkout, no npm/cargo install: downloads
#                                     the build artifacts and the Tauri CLI npm tarballs (pinned
#                                     version, SHA-512 checked in this file) and runs
#                                     `tauri signer sign --app-version` per updater artifact.
#                                     The key exists only in that one step's environment
#   publish         contents: write   uploads the build artifacts to the draft; no checkout
#   finalize        contents: write + id-token: write + attestations: write
#                   no checkout, no cargo install; only cosign-installer (pinned cosign release,
#                   checksum-verified by the installer), attest-build-provenance and the
#                   updater-manifest script from the tag's checkout. It hashes the workflow
#                   artifacts (not the draft), signs, attests, uploads, then fails if the draft
#                   holds any file that SHA256SUMS does not cover.
#
# Runs must come from the tag ref: a push of `v*`, or `workflow_dispatch` started *from the tag*
# ("Use workflow from" → Tags). The cosign identity verify-release.sh accepts is
# `release.yml@refs/tags/<tag>` only (N-58), and the `release` environment admits tags only.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0. Run the workflow FROM that tag. Uploads into its draft release."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Same compiler as release-repro.yml (scripts/release/lint-workflows.sh enforces it). Bump
  # both together with the `rust-version` floor in Cargo.toml.
  RUST_TOOLCHAIN: "1.97.0"
  # Tauri CLI used by sign-updater (`signer sign`), fetched as npm tarballs and checked against
  # these SHA-512 integrity values (the ones pnpm-lock.yaml records for @tauri-apps/cli 2.12.4).
  TAURI_CLI_VERSION: "2.12.4"
  TAURI_CLI_SHA512: "JI9bHfudSRJikGOrjbXEm6RjzzvmKuLc+JixB1NE8hNzQkNlCCIC3pTES3uypkR9lxHrsbxzcnSwhI2IxBQphw=="
  TAURI_CLI_LINUX_X64_SHA512: "tNzZSa79Z1nRpHxEpQ38lsAFpKlFlYvoXzjTV+lRRn/zSf3wrdUC3wnLcq2XEadchPu4ttK0zivhYzr+XGD19Q=="

jobs:
  create-release:
    name: draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Tag matches the declared versions
        id: check
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]] || { echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          version="${BASH_REMATCH[1]}"
          # The signing identity is this workflow at the tag ref (N-58) and the `release`
          # environment admits tag refs only, so a dispatch from a branch cannot produce a
          # verifiable release: refuse it early instead of failing in sign-updater.
          [[ "$GITHUB_REF" == "refs/tags/$TAG" ]] || { echo "::error::run from the tag itself (Use workflow from → Tags → $TAG), not from $GITHUB_REF"; exit 1; }
          # ubuntu-22.04 ships Python 3.10 (no tomllib): read the workspace version with sed.
          cargo_v=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p}' Cargo.toml | head -1)
          tauri_v=$(python3 -I -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          for pair in "Cargo.toml:$cargo_v" "tauri.conf.json:$tauri_v"; do
            [[ "${pair#*:}" == "$version" ]] || { echo "::error::${pair%%:*} says ${pair#*:}, tag says $version (run make bump)"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # M-17 (4): the updater key may be referenced by the sign-updater job only, and the Rust
      # toolchain pin must equal release-repro.yml's. Pure bash + python -I, no dependencies.
      - name: Lint the release workflows (updater key scope, toolchain pin)
        run: bash scripts/release/lint-workflows.sh .github/workflows

      - name: Create or reuse the draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0] | select(. != null) | \"\(.id) \(.draft)\"")
          if [[ -n "$existing" ]]; then
            read -r id draft <<<"$existing"
            [[ "$draft" == true ]] || { echo "::error::$TAG is already published; cut a new version"; exit 1; }
            echo "reusing draft release $id"
          else
            flags=(--draft --verify-tag --generate-notes --title "Mooring $VERSION")
            [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" --repo "$GITHUB_REPOSITORY"
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

      # finalize has no checkout; it gets the release scripts from this job's checkout of the tag.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-scripts
          path: scripts/release/*.sh
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # artifacts go to the workflow; `publish` uploads them to the draft
    strategy:
      fail-fast: false
      matrix:
        # `updater`: whether the job ships an updater artifact for sign-updater. macOS: only the
        # universal build (one `.app.tar.gz` fills both darwin slots of latest.json). Windows:
        # the NSIS -setup.exe. Linux: the AppImage (absent on pre-releases).
        include:
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, rust: aarch64-apple-darwin, arch: aarch64, bundles: "app,dmg", updater: false }
          - { name: macos-x64, os: macos-15, target: x86_64-apple-darwin, rust: x86_64-apple-darwin, arch: x64, bundles: "app,dmg", updater: false }
          - { name: macos-universal, os: macos-15, target: universal-apple-darwin, rust: "aarch64-apple-darwin,x86_64-apple-darwin", arch: universal, bundles: "app,dmg", updater: true }
          - { name: windows-x64, os: windows-2022, target: x86_64-pc-windows-msvc, rust: x86_64-pc-windows-msvc, arch: x64, bundles: "nsis,msi", updater: true }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, rust: x86_64-unknown-linux-gnu, arch: amd64, bundles: "deb,rpm,appimage", updater: true }
          # linuxdeploy cannot cross-build AppImages; GitHub's native arm64 runner is free for public repos.
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, rust: aarch64-unknown-linux-gnu, arch: arm64, bundles: "deb,rpm,appimage", updater: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Linux WebView + bundler toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file libfuse2

      - run: pnpm install --frozen-lockfile

      # Platform signing material only. The updater key (TAURI_SIGNING_PRIVATE_KEY) is never
      # exported here: this job runs npm and cargo build scripts (M-17); sign-updater holds it.
      - name: Export signing material that exists
        id: secrets
        shell: bash
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          S_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          S_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          S_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          S_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          S_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          S_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          S_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          S_TAURI_SIGNING_RPM_KEY: ${{ secrets.TAURI_SIGNING_RPM_KEY }}
          S_TAURI_SIGNING_RPM_KEY_PASSPHRASE: ${{ secrets.TAURI_SIGNING_RPM_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          put() { local d; d="EOF_$(openssl rand -hex 16)"; printf '%s<<%s\n%s\n%s\n' "$1" "$d" "$2" "$d" >> "$GITHUB_ENV"; }
          has() { local v="S_$1"; [[ -n "${!v:-}" ]]; }
          case "$RUNNER_OS" in
            macOS) names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY) ;;
            Windows) names=(AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD) ;;
            Linux) names=(TAURI_SIGNING_RPM_KEY TAURI_SIGNING_RPM_KEY_PASSPHRASE) ;;
          esac
          for n in "${names[@]}"; do if has "$n"; then v="S_$n"; put "$n" "${!v}"; fi; done
          if [[ "$RUNNER_OS" == macOS ]]; then
            if ! has APPLE_CERTIFICATE; then put APPLE_SIGNING_IDENTITY "-"; fi  # ad-hoc: consistent bundle signature
            if has APPLE_API_KEY && has APPLE_API_KEY_P8; then
              p8="$RUNNER_TEMP/AuthKey_${S_APPLE_API_KEY}.p8"
              printf '%s\n' "$S_APPLE_API_KEY_P8" > "$p8"; chmod 600 "$p8"; put APPLE_API_KEY_PATH "$p8"
            fi
          fi
          signed=false
          case "$RUNNER_OS" in
            macOS) has APPLE_CERTIFICATE && signed=true ;;
            Windows) { has AZURE_CLIENT_ID || has WINDOWS_CERTIFICATE; } && signed=true ;;
            Linux) has TAURI_SIGNING_RPM_KEY && signed=true ;;
          esac
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Import Authenticode certificate (PFX)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != '' && env.AZURE_CLIENT_ID == ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # RISK (security review 3, L-13): `artifact-signing-cli` is a community crate
      # (levminer/trusted-signing-cli) without a security review. It runs with
      # AZURE_CLIENT_SECRET in its environment and signs the Windows binaries. It is pinned to an
      # exact version with `--locked` (crates.io checksums from its lockfile); bump it only with
      # security-reviewer approval. Replacement candidates: Azure/trusted-signing-action
      # (SHA-pinned) or the .NET Foundation `sign` tool. This job has `contents: read` only.
      - name: Install Azure Artifact Signing CLI
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        run: cargo install artifact-signing-cli --version =0.12.0 --locked

      - name: Compose CI-only Tauri config
        id: cfg
        shell: python
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          VERSION: ${{ needs.create-release.outputs.version }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          import json, os, pathlib
          env = os.environ.get
          # tauri.conf.json says createUpdaterArtifacts: true (ADR-0018), which makes the Tauri
          # CLI demand TAURI_SIGNING_PRIVATE_KEY in *this* job's environment. Forced off here
          # (M-17): the build never holds the key, the bundler creates no `.sig`, and
          # plugins.updater.pubkey is still compiled in (tauri-build reads the merged config).
          # The updater archives are made below and signed by the sign-updater job.
          bundle = {"createUpdaterArtifacts": False}
          # The rpm and AppImage bundlers reject '-' in a version and Tauri rejects '~' (not
          # semver), so pre-releases ship the .deb only on Linux; stable releases add rpm + AppImage.
          bundles = env("BUNDLES")
          if "-" in env("VERSION") and env("RUNNER_OS") == "Linux":
              bundles = ",".join(b for b in bundles.split(",") if b not in ("appimage", "rpm"))
          win = {}
          if "-" in env("VERSION"):
              # MSI ProductVersion is numeric; 0.2.0-rc.1 ships as MSI 0.2.0.
              win["wix"] = {"version": env("VERSION").split("-")[0]}
          azure = [env("AZURE_SIGNING_ENDPOINT"), env("AZURE_SIGNING_ACCOUNT"), env("AZURE_SIGNING_PROFILE")]
          if env("AZURE_CLIENT_ID"):
              if not all(azure):
                  raise SystemExit("AZURE_CLIENT_ID is set but vars AZURE_SIGNING_ENDPOINT/ACCOUNT/PROFILE are not")
              win["signCommand"] = {"cmd": "artifact-signing-cli",
                                    "args": ["-e", azure[0], "-a", azure[1], "-c", azure[2], "-d", "Mooring", "%1"]}
          elif env("WINDOWS_CERT_THUMBPRINT"):
              win.update(certificateThumbprint=env("WINDOWS_CERT_THUMBPRINT"),
                         timestampUrl="http://timestamp.digicert.com")
          if win:
              bundle["windows"] = win
          path = pathlib.Path(env("RUNNER_TEMP")) / "tauri.ci.json"
          path.write_text(json.dumps({"bundle": bundle} if bundle else {}))
          with open(env("GITHUB_OUTPUT"), "a") as out:
              out.write(f"path={path.as_posix()}\n")
              out.write(f"bundles={bundles}\n")

      # Build only: no releaseId/tagName and no token, so tauri-action cannot touch the release
      # and writes no latest.json; finalize builds the manifest from the `.sig` files.
      - name: Build with tauri-action
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          args: --target ${{ matrix.target }} --bundles ${{ steps.cfg.outputs.bundles }} --config ${{ steps.cfg.outputs.path }}
          retryAttempts: 1

      - name: Build .pkg from the .app
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/Mooring.app"
          pkg="$RUNNER_TEMP/Mooring_${VERSION}_${{ matrix.arch }}.pkg"
          scripts/release/macos-pkg.sh "$app" "$VERSION" "$pkg"
          [[ -f "$pkg" ]] || { echo "::error::.pkg was not produced"; exit 1; }
          echo "PKG_PATH=$pkg" >> "$GITHUB_ENV"

      # The macOS updater artifact is a gzipped tar whose single top-level entry is the .app
      # (tauri-plugin-updater strips the first path component). Made after tauri-action, so the
      # bundle inside is the signed, notarized one. COPYFILE_DISABLE keeps bsdtar from adding
      # `._*` AppleDouble entries. Same name the Tauri bundler would have used, plus the arch.
      - name: Updater archive from the .app
        if: runner.os == 'macOS' && matrix.updater
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release/bundle/macos"
          [[ -d "$dir/Mooring.app" ]] || { echo "::error::$dir/Mooring.app not found"; exit 1; }
          archive="$RUNNER_TEMP/Mooring_${ARCH}.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$dir" Mooring.app
          tar -tzf "$archive" | awk -F/ '{print $1}' | sort -u | grep -qx 'Mooring.app' || { echo "::error::unexpected archive layout"; exit 1; }
          echo "UPDATER_ARCHIVE=$archive" >> "$GITHUB_ENV"

      # ADR-0021 §4: the portable zips. Windows: the bare exe tauri-action built (Tauri names
      # it from productName; see the check below), macOS: the same ad-hoc signed .app the dmg
      # and the updater archive carry (`_CodeSignature` and the Frameworks symlinks survive,
      # portable-zip.py stores symlinks as symlinks). Plus the empty `portable` marker and a
      # README. Deterministic (SOURCE_DATE_EPOCH = the tagged commit's time, like finalize).
      # They are release assets like any other (SHA256SUMS, provenance) but NOT updater
      # artifacts: sign-updater excludes `*_portable.zip` and latest.json never lists them.
      - name: Portable zip
        if: matrix.name == 'windows-x64' || matrix.name == 'macos-universal'
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/portable"; mkdir -p "$stage"
          : > "$stage/portable"
          sed "s/@VERSION@/$VERSION/g" packaging/portable/README.txt > "$stage/README.txt"
          ! grep -q '@' "$stage/README.txt" || { echo "::error::README.txt still holds a placeholder"; exit 1; }
          case "$RUNNER_OS" in
            Windows)
              # Tauri 2 renames the cargo binary (mooring-app) to productName before bundling.
              exe="target/$TARGET/release/Mooring.exe"
              [[ -f "$exe" ]] || { echo "::error::$exe not found; release dir holds: $(ls "target/$TARGET/release"/*.exe 2>/dev/null | tr '\n' ' ')"; exit 1; }
              entries=("Mooring.exe=$exe") ;;
            macOS)
              app="target/$TARGET/release/bundle/macos/Mooring.app"
              [[ -d "$app/Contents/_CodeSignature" ]] || { echo "::error::$app is missing or unsigned"; exit 1; }
              entries=("Mooring.app=$app") ;;
            *) echo "::error::no portable build for $RUNNER_OS"; exit 1 ;;
          esac
          zip="$RUNNER_TEMP/Mooring_${VERSION}_${ARCH}_portable.zip"
          epoch=$(git log -1 --format=%ct HEAD)
          python3 -I scripts/release/portable-zip.py --out "$zip" --epoch "$epoch" \
            "${entries[@]}" "portable=$stage/portable" "README.txt=$stage/README.txt"
          python3 -I -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).testzip() is None or sys.exit("corrupt zip")' "$zip"
          echo "PORTABLE_ZIP=$zip" >> "$GITHUB_ENV"

      - name: Collect release files
        shell: bash
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          files=()
          while IFS= read -r line; do line="${line%$'\r'}"; [[ -n "$line" ]] && files+=("$line"); done < <(python3 -I -c 'import json,os;[print(p) for p in json.loads(os.environ["PATHS"])]')
          [[ -n "${PKG_PATH:-}" ]] && files+=("$PKG_PATH")
          [[ -n "${UPDATER_ARCHIVE:-}" ]] && files+=("$UPDATER_ARCHIVE")
          [[ -n "${PORTABLE_ZIP:-}" ]] && files+=("$PORTABLE_ZIP")
          for f in "${files[@]}"; do
            f="${f//\\//}" # Windows runners report D:\a\... paths; Git Bash wants forward slashes
            [[ -f "$f" ]] || continue # .app bundles are directories; the .dmg / .app.tar.gz carry them
            name=$(basename "$f")
            [[ "$name" != *.sig ]] || { echo "::error::the build produced a signature ($name); updater signing belongs to sign-updater"; exit 1; }
            [[ ! -e "$out/$name" ]] || { echo "::error::duplicate release file $name"; exit 1; }
            cp -- "$f" "$out/$name"
          done
          ls -la "$out"
          (( $(find "$out" -type f | wc -l) > 0 )) || { echo "::error::no release files"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        shell: bash
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo "signed: ${{ steps.secrets.outputs.signed }} · updater artifact: ${{ matrix.updater }} (signed later by sign-updater)"
            echo '```'; echo "$PATHS" | tr ',' '\n' | sed 's/[][]//g;s/"//g'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: SBOMs (CycloneDX)
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: read # no id-token: these tools never run next to the signing identity
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust SBOM (CycloneDX, cargo-cyclonedx)
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo install cargo-cyclonedx --version =0.5.9 --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --spec-version 1.5 \
            --target all --override-filename mooring-app.cdx
          mv src-tauri/mooring-app.cdx.json "sbom/mooring-${VERSION}-cargo.cdx.json"
          rm -f crates/*/mooring-app.cdx.json # cargo-cyclonedx also writes one per workspace member

      - name: Source SBOM incl. npm (CycloneDX, syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom/mooring-${{ env.VERSION }}-source.cdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  # M-17: the only job that ever sees the updater private key. `environment: release` makes the
  # key an environment secret (required reviewer = owner, deployment policy tags `v*`); a
  # repository secret of the same name must not exist. No checkout: nothing from the repository
  # runs here. No npm/cargo install: the Tauri CLI comes as two npm tarballs whose SHA-512 is
  # pinned above, unpacked with tar (no lifecycle scripts) and run with the runner's node.
  # The key enters the environment of the signing step only.
  sign-updater:
    name: sign updater artifacts
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: true

      - name: Fetch the pinned Tauri CLI (npm tarballs, SHA-512 checked)
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          base="https://registry.npmjs.org/@tauri-apps"
          tools="$RUNNER_TEMP/tauri-cli/node_modules/@tauri-apps"
          fetch() { # fetch <package> <sha512-base64>: verify, then unpack into node_modules
            local pkg="$1" want="$2" tgz="$RUNNER_TEMP/$1.tgz" got
            curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
              -o "$tgz" "$base/$pkg/-/$pkg-$TAURI_CLI_VERSION.tgz"
            got=$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)
            [[ "$got" == "$want" ]] || { echo "::error::SHA-512 mismatch for $pkg@$TAURI_CLI_VERSION"; exit 1; }
            mkdir -p "$tools/$pkg"
            tar -xzf "$tgz" -C "$tools/$pkg" --strip-components=1
          }
          fetch cli "$TAURI_CLI_SHA512"
          fetch cli-linux-x64-gnu "$TAURI_CLI_LINUX_X64_SHA512"
          cli="$tools/cli/tauri.js"
          [[ "$(node "$cli" --version)" == "tauri-cli $TAURI_CLI_VERSION" ]] || { echo "::error::unexpected Tauri CLI"; exit 1; }
          echo "path=$cli" >> "$GITHUB_OUTPUT"

      # `--app-version` binds the version into the signed trusted comment, as `tauri build`
      # does; clients with requireSignedVersion refuse a manifest that announces another one.
      # Stdout of the signer (it echoes the public signature) is dropped; only file names are
      # printed. Without the key (fork, or the secret not created yet) nothing is signed and
      # the release ships no in-app update channel.
      - name: Sign updater artifacts
        id: sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLI: ${{ steps.cli.outputs.path }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set in environment 'release'; updater artifacts stay unsigned, no latest.json"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The key has no password. GitHub refuses an empty secret, so the password secret is
          # either absent or whitespace; both mean "no password" (rc.2 dry run: a one-space
          # secret was rejected by the signer as a wrong password).
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD//[[:space:]]/}" ]]; then
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          # Updater artifacts only. The portable zips (ADR-0021) are release assets, never
          # updater artifacts: excluded by name here (lint-workflows.sh checks this stays),
          # refused by updater-manifest.sh, and verify-release.sh fails on a `.sig` for them.
          mapfile -t targets < <(find artifacts -maxdepth 1 -type f ! -name '*_portable.zip' \
            \( -name '*.app.tar.gz' -o -name '*-setup.exe' -o -name '*.AppImage' \) | LC_ALL=C sort)
          ((${#targets[@]} > 0)) || { echo "::error::no updater artifacts among the build outputs"; exit 1; }
          for f in "${targets[@]}"; do [[ "$f" != *_portable.zip ]] || { echo "::error::portable zip selected for updater signing: $f"; exit 1; }; done
          mkdir sigs
          for f in "${targets[@]}"; do
            name=${f##*/}
            node "$CLI" signer sign --app-version "$VERSION" "$f" >/dev/null \
              || { echo "::error::signing failed for $name"; exit 1; }
            sig=$(tr -d '\r\n' < "$f.sig")
            [[ "$sig" =~ ^[A-Za-z0-9+/=]+$ && ${#sig} -ge 64 ]] || { echo "::error::$name.sig is not a base64 signature"; exit 1; }
            mv "$f.sig" "sigs/$name.sig"
            echo "signed $name"
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.sign.outputs.signed == 'true'
        with:
          name: updater-signatures
          path: sigs/*.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    name: upload installers to the draft
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # the only job besides create-release/finalize that writes the release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # No checkout: nothing from the repository or a dependency runs while this token can write.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: false

      - name: Upload installers
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r line; do line="${line%$'\r'}"; [[ -n "$line" ]] && files+=("$line"); done < <(find dist -type f | LC_ALL=C sort)
          dupes=$(printf '%s\n' "${files[@]##*/}" | sort | uniq -d)
          [[ -z "$dupes" ]] || { echo "::error::same file name from two builds: $dupes"; exit 1; }
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" "${files[@]}"

  finalize:
    name: checksums, signature, provenance
    needs: [create-release, build, sbom, sign-updater, publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # upload SHA256SUMS, bundle, SBOMs, updater signatures and manifest
      id-token: write # Sigstore keyless signing + attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # No checkout and no cargo/npm install: with id-token the job runs only these pinned
      # actions. cosign-installer verifies the cosign release it downloads (pinned below).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Release scripts from the tag's checkout (create-release job)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-scripts
          path: tools

      - name: Workflow artifacts (not the draft) are what gets signed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: artifacts/sbom

      - name: Updater signatures (sign-updater job)
        if: needs.sign-updater.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: updater-signatures
          path: artifacts/updater-signatures

      - name: Flatten
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          while IFS= read -r -d '' f; do
            name=${f##*/}
            [[ ! -e "dist/$name" ]] || { echo "::error::duplicate file $name"; exit 1; }
            cp -- "$f" "dist/$name"
          done < <(find artifacts -type f -print0)
          ls -la dist

      # Written before SHA256SUMS so the manifest is hashed, signed and attested like every other
      # file. Without `.sig` files (sign-updater had no key) the script writes nothing and the
      # release has no in-app update channel. pub_date is the tagged commit's time, stable
      # across re-runs.
      - name: Updater manifest (latest.json) from the .sig files
        shell: bash
        run: |
          set -euo pipefail
          committed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .commit.committer.date)
          SOURCE_DATE_EPOCH=$(date -u -d "$committed" +%s) bash tools/updater-manifest.sh dist "$TAG" "$GITHUB_REPOSITORY"

      - name: SHA256SUMS + cosign keyless signature
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --yes

      - name: SLSA build provenance for every artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload checksums, signature, SBOMs, updater signatures and manifest
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          [[ -f dist/latest.json ]] && extra+=(dist/latest.json)
          while IFS= read -r -d '' f; do extra+=("$f"); done < <(find dist -maxdepth 1 -type f -name '*.sig' -print0)
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            dist/SHA256SUMS dist/SHA256SUMS.sigstore.json dist/*.cdx.json "${extra[@]}"

      - name: The draft holds exactly the signed files
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > draft.txt
          { awk '{sub(/^\*/,"",$2); print $2}' dist/SHA256SUMS; echo SHA256SUMS; echo SHA256SUMS.sigstore.json; } \
            | LC_ALL=C sort > signed.txt
          if ! diff -u signed.txt draft.txt; then
            echo "::error::draft assets differ from the signed set (stale files from an earlier run? delete them and re-run)"
            exit 1
          fi
          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          {
            echo "### Draft ready: $url"
            echo "Review the notes and assets, then publish. Verify with:"
            echo '```'; echo "scripts/release/verify-release.sh $TAG $GITHUB_REPOSITORY"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
