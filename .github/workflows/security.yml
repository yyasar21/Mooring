name: security
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly advisory re-check
permissions: { contents: read, security-events: write }

jobs:
  rust-deps:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11
        with: { toolchain: stable }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check }
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }

  npm-deps:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  semgrep:
    runs-on: ubuntu-22.04
    # TODO(L-14): pin by digest (semgrep/semgrep@sha256:...). Docker Hub was unreachable from the
    # session that pinned the actions, so the image tag is still floating.
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/rust --config p/typescript --config p/secrets --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always()
        with: { sarif_file: semgrep.sarif }

  unsafe-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: forbid(unsafe_code) is present in every crate
        run: |
          for f in crates/*/src/lib.rs src-tauri/src/lib.rs; do
            grep -q 'forbid(unsafe_code)' "$f" || { echo "missing forbid(unsafe_code) in $f"; exit 1; }
          done
