name: security
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly advisory re-check
permissions: { contents: read, security-events: write }

jobs:
  rust-deps:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11
        with: { toolchain: stable }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check }
      # cargo-audit run directly: no check-run writes (workflow token is read-only) and the
      # accepted advisories are the same ones deny.toml documents (R-RSA, unmaintained build-time deps).
      - run: cargo install --locked cargo-audit
      - run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0374 --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372 --ignore RUSTSEC-2026-0441

  npm-deps:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  semgrep:
    runs-on: ubuntu-22.04
    # TODO(L-14): digest. Docker Hub (registry-1.docker.io, hub.docker.com) is unreachable from
    # the agent sessions, so the digest must be resolved on a machine with Docker Hub access and
    # pasted here as `semgrep/semgrep:<version>@sha256:<digest>`. Either command works:
    #   docker manifest inspect --verbose semgrep/semgrep:latest | jq -r '.[0].Descriptor.digest // .Descriptor.digest'
    #   docker buildx imagetools inspect semgrep/semgrep:latest --format '{{.Manifest.Digest}}'
    # (the multi-arch index digest; pin the tag that `docker run semgrep/semgrep:latest semgrep --version`
    # reports next to it, so a reader knows which release the digest is). Renovate/Dependabot
    # can bump a digest-pinned `image:`; a floating tag is what L-14 rejects.
    container: { image: semgrep/semgrep:latest@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 } # L-14: pinned 2026-11-06 (index digest of :latest)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          semgrep scan --config p/rust --config p/typescript --config p/secrets --error --sarif --output semgrep.sarif || {
            python3 - <<'PY'
          import json
          d = json.load(open("semgrep.sarif"))
          for run in d.get("runs", []):
              for r in run.get("results", []):
                  loc = r["locations"][0]["physicalLocation"]
                  print("::error file=%s,line=%s::%s: %s" % (loc["artifactLocation"]["uri"], loc["region"]["startLine"], r["ruleId"].split(".")[-1], r["message"]["text"][:200].replace("\n", " ")))
          PY
            exit 1
          }
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always()
        with: { sarif_file: semgrep.sarif }

  unsafe-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: forbid(unsafe_code) is present in every crate
        run: |
          for f in crates/*/src/lib.rs src-tauri/src/lib.rs; do
            grep -q 'forbid(unsafe_code)' "$f" || { echo "missing forbid(unsafe_code) in $f"; exit 1; }
          done
