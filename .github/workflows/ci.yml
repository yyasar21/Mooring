# Actions are pinned by commit SHA with the tag in a comment (security review 3, L-14);
# resolved with `git ls-remote` on 2026-11-03. Dependabot (github-actions) keeps them current.
name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11
        with: { toolchain: stable, components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - name: Linux WebView toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      # On failure the first error lines are re-emitted as workflow annotations, so a reviewer
      # (human or agent) can read them from the API without downloading the raw log.
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short --color never -- -D warnings 2>&1 | tee clippy.log || {
            { grep -aE ": (error|warning)(\[E[0-9]+\])?: " clippy.log | head -60 | sed 's/^/::error::/'; } || true
            echo "::group::clippy tail"; tail -n 40 clippy.log; echo "::endgroup::"
            tail -n 12 clippy.log | sed 's/^/::error::tail: /'
            exit 1
          }
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --color never 2>&1 | tee test.log || {
            { grep -E "^(test .* FAILED|error(\[E[0-9]+\])?:)" test.log | head -40 | sed 's/^/::error::/'; } || true
            # Each failing test's captured stdout (panic message, assertion, up to 25 lines).
            { awk '/^---- .* stdout ----$/{n=25} n>0{print "::error::" $0; n--}' test.log | head -200; } || true
            tail -n 30 test.log | sed 's/^/::error::tail: /'
            exit 1
          }
      - run: pnpm lint && pnpm typecheck
      - name: pnpm test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee vitest.log || {
            { grep -E "^ (FAIL|×)|AssertionError|Error:|expected|received|Test Files|Tests " vitest.log | head -80 | sed 's/^/::error::/'; } || true
            tail -n 30 vitest.log | sed 's/^/::error::tail: /'
            exit 1
          }
      - run: pnpm build
      - name: invoke() only in lib/ipc.ts (ADR-0003)
        shell: bash
        run: '! grep -rn "invoke(" apps/desktop/src --include=*.ts --include=*.tsx | grep -v "src/lib/ipc.ts"'
      - name: Tauri app compiles
        run: cargo build -p mooring-app
      # ADR-0028 §1: the checked-in config is the dev identity and only the release overlay
      # turns it into the release one (scripts/release/merge-config.py, standard library only).
      - name: Build identity (dev by default, release only via the overlay)
        if: runner.os == 'Linux'
        run: |
          python3 -I scripts/release/merge-config.py self-test
          python3 -I scripts/release/merge-config.py check-identity src-tauri
          bash scripts/release/tests/identity.test.sh
      # A real bundle of what a non-tag build produces: a debug .app without the overlay must be
      # "Mooring Dev" / io.github.yyasar21.mooring.dev (ADR-0028 test plan, pipeline).
      - name: Debug .app carries the dev identity (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri build --debug --bundles app --no-sign
          plist="target/debug/bundle/macos/Mooring Dev.app/Contents/Info.plist"
          [[ -f "$plist" ]] || { echo "::error::Mooring Dev.app not built; bundle dir holds: $(ls target/debug/bundle/macos)"; exit 1; }
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          [[ "$id" == io.github.yyasar21.mooring.dev ]] || { echo "::error::CFBundleIdentifier is '$id', want io.github.yyasar21.mooring.dev"; exit 1; }
          echo "dev identity: $id"
