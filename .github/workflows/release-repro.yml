# Reproducible-build check (ADR-0018 §4). Scope: the Rust workspace crates on Linux x86_64
# (`default-members`, everything but `mooring-app`), built twice with `--release --locked` from
# two different checkout paths and the pinned toolchain. SOURCE_DATE_EPOCH is the commit time;
# `--remap-path-prefix` removes the workspace and CARGO_HOME paths from the binaries. The job
# fails when any `libmooring_*.{rlib,rmeta}` differs between the two builds and uploads a
# diffoscope report. Not covered: the Tauri bundles (timestamps and host data from hdiutil, WiX,
# ar, rpmbuild, squashfs; signatures embed time; WebView libraries differ by runner image).
#
# Runs weekly, on every `v*` tag and on dispatch. `contents: read` only; nothing is published.
name: release-repro

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to check (default: the default branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-repro-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned on purpose: a different compiler is a different build. Bump together with the
  # `rust-version` floor in Cargo.toml and note it in the handoff.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  repro:
    name: two builds, one hash set (Linux x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      # Two checkouts under different directories: a reproducible build must not depend on
      # where the source tree lives. CARGO_HOME differs too (registry sources are remapped).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: build-a/src
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: build-b/deeper/path/src
          persist-credentials: false

      - name: Build twice
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git -C build-a/src log -1 --format=%ct)
          [[ "$epoch" == "$(git -C build-b/deeper/path/src log -1 --format=%ct)" ]] || { echo "::error::the two checkouts differ"; exit 1; }
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          build() { # build <checkout dir> <cargo home>
            local src; src=$(cd "$1" && pwd)
            local home; home=$(mkdir -p "$2" && cd "$2" && pwd)
            # Separate CARGO_HOME per build: the registry is re-fetched, so a build that only
            # reproduces because of a shared cache cannot pass by accident.
            env SOURCE_DATE_EPOCH="$epoch" CARGO_HOME="$home" \
              RUSTFLAGS="--remap-path-prefix=$src=/mooring --remap-path-prefix=$home=/cargo -C codegen-units=1" \
              cargo build --manifest-path "$src/Cargo.toml" --release --locked \
                --target x86_64-unknown-linux-gnu --target-dir "$src/target"
          }
          build build-a/src build-a/cargo-home
          build build-b/deeper/path/src build-b/cargo-home

      - name: Compare the workspace crate outputs
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          hashes() { # hashes <checkout dir>: sha256 of every workspace rlib/rmeta, by file name
            (cd "$1/target/x86_64-unknown-linux-gnu/release/deps" \
              && find . -maxdepth 1 -type f \( -name 'libmooring_*.rlib' -o -name 'libmooring_*.rmeta' \) -printf '%P\n' \
              | LC_ALL=C sort | xargs -d '\n' sha256sum --)
          }
          hashes build-a/src > a.sums
          hashes build-b/deeper/path/src > b.sums
          n=$(wc -l < a.sums)
          (( n > 0 )) || { echo "::error::no libmooring_* outputs found"; exit 1; }
          echo "$n workspace crate outputs per build"
          if diff -u a.sums b.sums; then
            echo "reproducible=true" >> "$GITHUB_OUTPUT"
            { echo "### Reproducible: $n crate outputs identical across two build paths"; echo '```'; cat a.sums; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reproducible=false" >> "$GITHUB_OUTPUT"
            echo "::error::workspace crate outputs differ between the two builds (see the diffoscope report artifact)"
            { echo "### NOT reproducible"; echo '```'; diff -u a.sums b.sums || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: diffoscope report for the differing files
        if: steps.compare.outputs.reproducible == 'false'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends diffoscope
          mkdir report
          diff <(cut -d' ' -f3- a.sums) <(cut -d' ' -f3- b.sums) >/dev/null || echo "file sets differ" > report/file-sets.txt
          while read -r hash_a name; do
            hash_b=$(awk -v n="$name" '$2==n {print $1}' b.sums)
            [[ -n "$hash_b" && "$hash_a" != "$hash_b" ]] || continue
            diffoscope --max-report-size 10000000 --html "report/$name.html" \
              "build-a/src/target/x86_64-unknown-linux-gnu/release/deps/$name" \
              "build-b/deeper/path/src/target/x86_64-unknown-linux-gnu/release/deps/$name" || true
          done < a.sums

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.compare.outputs.reproducible == 'false'
        with:
          name: diffoscope-report
          path: report/
          retention-days: 14

      - name: Fail when not reproducible
        if: steps.compare.outputs.reproducible == 'false'
        run: exit 1
