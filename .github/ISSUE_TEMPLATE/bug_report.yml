name: Bug report
description: Something in Mooring does not work as expected.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Security vulnerabilities must not be reported here** —
        use the Security tab ("Report a vulnerability") instead, see SECURITY.md.

        Do not paste secrets, real hostnames, IP addresses or usernames. Replace them with
        placeholders such as `host.example.test` or `<your-host>`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a connection to `host.example.test` with protocol SSH
        2. Open it from the command palette
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Vault (create, unlock, lock, password)
        - Connection tree / search
        - Credentials
        - SSH terminal
        - Host-key verification
        - Audit log
        - User interface / themes / shortcuts
        - Build / installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mooring version or commit
      placeholder: "v0.1.0 or commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux (Debian / Ubuntu)
        - Linux (Fedora / RHEL)
        - Linux (other)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and, on Linux, desktop session
      placeholder: "macOS 15.1 / Windows 11 24H2 / Fedora 41 GNOME Wayland"
  - type: textarea
    id: server
    attributes:
      label: Remote side (if relevant)
      description: Server software and version, e.g. `OpenSSH_9.6`. No hostnames.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant log output with `MOORING_LOG=debug`. Mooring never logs secrets, but check
        for hostnames and usernames before pasting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets, hostnames and other private data from this report.
          required: true
